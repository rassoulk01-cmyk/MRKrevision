<script>

const M={"Mathématiques":["➗","Maths"],"Physique-Chimie":["⚗️","Phys-Chimie"],"SVT":["🌱","SVT"],"Français":["📖","Français"],"Histoire-Géographie":["🌍","Hist-Géo"],"Anglais":["🇬🇧","Anglais"],"Espagnol":["🇪🇸","Espagnol"],"Philosophie":["🧠","Philo"],"ECM":["🤝","ECM"]};

const SUBJ={"6e":COL,"5e":COL,"4e":COL.concat("Espagnol"),"3e":COL.concat("Espagnol"),
"2nde":["Mathématiques","Physique-Chimie","SVT","Français","Histoire-Géographie","Anglais","Espagnol"],
"1ère":["Mathématiques","Physique-Chimie","SVT","Français","Histoire-Géographie","Anglais","Espagnol"],
"Terminale L":["Philosophie","Français","Histoire-Géographie","Anglais","Mathématiques","Espagnol","SVT"],
"Terminale S":["Mathématiques","Physique-Chimie","SVT","Philosophie","Français","Histoire-Géographie","Anglais"]};
const SERIES={"Terminale L":["L1","L2"],"Terminale S":["S1","S2"]};
const FRC=["Grammaire","Conjugaison","Orthographe & dictée","Vocabulaire","Lecture & étude de texte","Expression écrite (rédaction)","Œuvres au programme"];
const FRL=["Étude de texte / lecture méthodique","Commentaire composé","Dissertation littéraire","Contraction de texte & discussion","Grammaire & langue","Œuvres au programme","Histoire littéraire & mouvements"];
const TABS=[["home","🏠","Accueil"],["prof","💬","Prof IA"],["cours","📘","Cours"],["exos","✏️","Exercices"],["quiz","🎯","Quiz"],["exam","📝","Examens"]];
const TIPS=["Révise 25 minutes, pause 5 minutes : ton cerveau retient mieux ainsi.","Refais les exercices corrigés SANS regarder le corrigé, puis compare.","Avant un devoir, relis tes erreurs passées : ce sont tes meilleures leçons.","Explique ta leçon à voix haute comme si tu étais le professeur.","Dors bien la veille d'un examen : mieux vaut 8 h de sommeil qu'une nuit blanche.","En maths, écris toujours la formule avant de calculer."];
/* ====== CONFIGURATION GROQ ======
 ⚠️ Ne mets PAS ta clé ici si ton dépôt GitHub est public : tout le monde pourrait la voir et l'utiliser.
 Laisse vide : chaque utilisateur colle sa clé dans ⚙️ Paramètres (stockée dans son navigateur). */
const GROQ_API_KEY="";
const GROQ_MODEL="llama-3.3-70b-versatile";
const GROQ_URL="https://api.groq.com/openai/v1/chat/completions";
let S={cls:null,serie:null,tab:"home",subj:{},dom:{},chat:[],busy:false,last:null,name:"",key:"",mem:[],set:{theme:"auto",size:"16",style:"equilibre",model:GROQ_MODEL,memOn:true}};
try{S.cls=localStorage.getItem("mk_cls");S.serie=localStorage.getItem("mk_serie");S.name=localStorage.getItem("mk_name")||"";S.key=localStorage.getItem("mk_key")||"";S.mem=JSON.parse(localStorage.getItem("mk_mem")||"[]")}catch(e){}
try{Object.assign(S.set,JSON.parse(localStorage.getItem("mk_set")||"{}"))}catch(e){}
if(S.cls&&!SUBJ[S.cls])S.cls=null;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const isExam=()=>S.cls==="3e"||S.cls.startsWith("Term");
const examName=()=>S.cls==="3e"?"BFEM":S.cls.startsWith("Term")?"BAC":"";
const base=n=>n.replace(/ \(.*/,"");
const SYM={times:"×",cdot:"·",div:"÷",pm:"±",mp:"∓",approx:"≈",neq:"≠",ne:"≠",leq:"≤",le:"≤",geq:"≥",ge:"≥",Rightarrow:"⇒",Leftrightarrow:"⇔",rightarrow:"→",to:"→",leftarrow:"←",infty:"∞",pi:"π",alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",theta:"θ",lambda:"λ",mu:"μ",sigma:"σ",omega:"ω",Omega:"Ω",rho:"ρ",phi:"φ",varphi:"φ",epsilon:"ε",varepsilon:"ε",eta:"η",tau:"τ",sum:"∑",int:"∫",circ:"°",degree:"°",dots:"…",ldots:"…",cdots:"…",in:"∈",notin:"∉",cup:"∪",cap:"∩",subset:"⊂",forall:"∀",exists:"∃",emptyset:"∅",perp:"⊥",parallel:"∥",ll:"≪",gg:"≫",Rightarrow2:"⇒"};
function fx(x){
 x=x.replace(/\\begin\{[^}]*\}|\\end\{[^}]*\}/g,"").replace(/&amp;/g," ").replace(/\\\\/g,"<br>");
 x=x.replace(/\\(?:text|mathrm|mathbf|mathit|operatorname|mbox)\{([^{}]*)\}/g,"$1");
 x=x.replace(/\\boxed\{((?:[^{}]|\{[^{}]*\})*)\}/g,"<span class='bx'>$1</span>");
 for(let k=0;k<4;k++)x=x.replace(/\\[dt]?frac\s*\{((?:[^{}]|\{[^{}]*\})*)\}\s*\{((?:[^{}]|\{[^{}]*\})*)\}/g,"<span class='fr'><span>$1</span><span>$2</span></span>");
 x=x.replace(/\\sqrt\[(\d+)\]\{([^{}]*)\}/g,"<sup>$1</sup>√($2)").replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)").replace(/\\sqrt\s*([0-9a-zA-Z]+)/g,"√$1");
 x=x.replace(/\\vec\{([^{}]*)\}/g,"$1⃗").replace(/\\overrightarrow\{([^{}]*)\}/g,"$1⃗").replace(/\\overline\{([^{}]*)\}/g,"$1̅");
 x=x.replace(/\\(sin|cos|tan|ln|log|lim|exp|min|max|arcsin|arccos|arctan)\b/g,"$1");
 x=x.replace(/\\(?:left|right|big|Big)\b\s*/g,"").replace(/\\[,;:! ]|\\quad|\\qquad/g," ").replace(/\\%/g,"%");
 x=x.replace(/\\([A-Za-z]+)/g,(m,n)=>SYM[n]||n);
 x=x.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>");
 x=x.replace(/\^(-?[0-9]+|[a-zA-Z])/g,"<sup>$1</sup>").replace(/([A-Za-zΑ-ωΔ])_([0-9]+|[a-zA-Z])\b/g,"$1<sub>$2</sub>");
 return x.replace(/[{}]/g,"")}
function inl(l){
 const keep=[],tok=h=>{keep.push(h);return "\u0001"+(keep.length-1)+"\u0002"};
 l=l.replace(/`([^`]+)`/g,(m,a)=>tok("<span class='ix'>"+fx(a)+"</span>"))
    .replace(/\\\((.+?)\\\)/g,(m,a)=>tok("<span class='ix'>"+fx(a)+"</span>"))
    .replace(/\$\$(.+?)\$\$/g,(m,a)=>tok("<span class='ix'>"+fx(a)+"</span>"))
    .replace(/\$(?=[^\s$])([^$\n]*?[^\s$])\$|\$([^\s$])\$/g,(m,a,b)=>tok("<span class='ix'>"+fx(a||b)+"</span>"));
 l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,"$1<i>$2</i>");
 return l.replace(/\u0001(\d+)\u0002/g,(m,n)=>keep[+n])}
function md(t){
 t=t.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>"\n$$"+x.replace(/\n+/g," ").trim()+"$$\n").replace(/\\\[([\s\S]+?)\\\]/g,(m,x)=>"\n$$"+x.replace(/\n+/g," ").trim()+"$$\n");
 let o="",list="",code=false,cb=[],tb=[];
 const endList=()=>{if(list){o+="</"+list+">";list=""}},endTab=()=>{if(tb.length){const rows=tb.filter(r=>!/^\s*\|?[\s:\-|]+\|?\s*$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim())));
   if(rows.length){o+="<div class='tw'><table><thead><tr>"+rows[0].map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"+rows.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}tb=[]}};
 for(let l of esc(t).split("\n")){
  if(/^\s*```/.test(l)){if(code){o+="<div class='fm'>"+cb.map(fx).join("<br>")+"</div>";cb=[];code=false}else{endList();endTab();code=true}continue}
  if(code){cb.push(l);continue}
  if(/^\s*\|.*\|\s*$/.test(l)){endList();tb.push(l);continue}else endTab();
  let m;
  if(m=l.trim().match(/^\$\$(.+)\$\$$/)){endList();o+="<div class='fm'>"+fx(m[1].trim())+"</div>";continue}
  const b=inl(l);
  if(m=b.match(/^\s*(?:([-•*])|(\d+)[.)])\s+(.*)/)){const ty=m[2]?"ol":"ul";if(list!==ty){endList();o+="<"+ty+">";list=ty}o+="<li>"+m[3]+"</li>";continue}
  endList();
  if(m=b.match(/^#{1,4}\s+(.*)/)){const st=/^(<[^>]+>)*\s*(étape|etape|step)\s*\d/i.test(m[1]);o+="<h3"+(st?" class='st'":"")+">"+m[1]+"</h3>"}
  else if(/^[-—_]{3,}$/.test(b.trim()))o+="<hr>";
  else if(m=b.trim().match(/^(✅|⚠️|❌|📌|💡|🎯|🔍|📝)\s*(.*)/)){const c={"✅":"ok","⚠️":"wn","❌":"wn","📌":"df","💡":"tp","🎯":"ok","🔍":"tp","📝":"tp"}[m[1]];o+="<div class='cl "+c+"'>"+m[1]+" "+m[2]+"</div>"}
  else if(b.trim())o+="<p>"+b+"</p>"}
 if(code)o+="<div class='fm'>"+cb.map(fx).join("<br>")+"</div>";
 endTab();endList();return o}

const SYS=()=>`Tu es « MK Révision », un professeur sénégalais bienveillant, rigoureux et très pédagogue. Tu enseignes strictement selon les programmes officiels du Sénégal : cycle moyen (6e à 3e, 4 ans, examen du BFEM) et cycle secondaire général (2nde, 1ère, Terminale ; séries L1, L2, S1, S2 ; examen du Baccalauréat organisé par l'Office du Baccalauréat). L'élève ${S.name?"s'appelle "+S.name+" et ":""}est en classe de ${ctx()}. Appelle-le par son prénom de temps en temps pour l'encourager.${styStr()}${memStr()} Adapte le niveau, le vocabulaire et la difficulté à cette classe, et reste dans le cadre du programme de cette classe. Explique pas à pas, avec des exemples concrets du quotidien sénégalais (Dakar, marché, FCFA, baobab, Casamance, wolof, etc.) quand c'est pertinent. Structure avec des titres courts (###) et des listes. RÈGLES POUR LES FORMULES ET LES CALCULS (très important : l'élève doit tout suivre facilement, même s'il est faible en calcul). 1) N'écris JAMAIS de LaTeX compliqué. Écris chaque formule ou calcul important SUR SA PROPRE LIGNE entre deux doubles dollars, par exemple : $$ Aire = π × r² $$ ou $$ v = \\frac{d}{t} $$ (pour une fraction utilise \\frac{numérateur}{dénominateur}). Utilise les symboles Unicode (×, ÷, √, ², ³, π, ≈, ≤, ≥, →, Δ, °). Une petite formule dans une phrase se met entre $ $ simples. 2) Pour tout exercice ou calcul (maths, physique-chimie, SVT, etc.) suis TOUJOURS cette structure avec ces titres : ### 📌 La formule à connaître (écris la formule, puis explique chaque lettre avec son unité) ; ### 📝 Les données (liste ce qu'on connaît et ce qu'on cherche, avec les unités) ; ### ✍️ Le calcul pas à pas (sous-titres « ### Étape 1 : … », « ### Étape 2 : … » ; UNE seule opération par ligne ; on écrit d'abord la formule, ensuite on remplace les lettres par les nombres, ensuite on calcule chaque opération intermédiaire sans jamais sauter d'étape ; chaque étape est expliquée en une phrase très simple qui dit POURQUOI) ; ### ✅ Résultat (une ligne qui commence par ✅ et met la réponse finale avec son unité dans \\boxed{ }) ; ### 🔍 Vérification (contrôle rapide : ordre de grandeur, calcul inverse ou unité) ; puis une ligne qui commence par ⚠️ pour l'erreur fréquente à éviter. 3) Montre TOUS les calculs intermédiaires (exemple : 3 × 4 + 5 = 12 + 5 = 17), garde les unités à chaque ligne et précise les arrondis. Fais des phrases courtes et un vocabulaire simple. 4) Pour comparer, résumer ou donner un tableau de valeurs, utilise un tableau Markdown avec des barres |. 5) Pour une leçon qui contient des formules, commence par une ligne « 📌 À retenir » suivie de toutes les formules (chacune sur sa ligne entre $$ $$), puis donne au moins un exemple chiffré complet avec des nombres simples. 6) Vérifie chaque calcul deux fois avant de répondre : un résultat faux est pire qu'une explication courte.  Pour le français, respecte les méthodes attendues au Sénégal (étude de texte, contraction de texte, discussion, dissertation, commentaire composé en lycée ; rédaction, dictée, questions de grammaire et de vocabulaire en collège). Termine souvent par une courte question ou un mini-exercice pour vérifier la compréhension. Si tu n'es pas certain qu'un point figure au programme officiel, dis-le franchement et invite l'élève à vérifier avec son enseignant ou le site officedubac.sn. N'invente jamais de références ou de sujets officiels : les sujets proposés sont des sujets d'entraînement.`;

async function pickModel(key,bad){
 const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{Authorization:"Bearer "+key}});
 if(!r.ok)return null;const j=await r.json();
 const ids=(j.data||[]).filter(m=>m.active!==false).map(m=>m.id).filter(id=>id!==bad&&!/whisper|tts|guard|orpheus|embed|allam|safeguard/i.test(id));
 for(const p of PREF)if(ids.includes(p))return p;
 return ids[0]||null}
async function ask(input,onText,_retry){
 const key=(GROQ_API_KEY||S.key||"").replace(/[^\x21-\x7E]/g,"");if(!key)throw{message:"Clé Groq manquante : ouvre ⚙️ Paramètres (en haut à droite) pour l'ajouter."};

 try{res=await fetch(GROQ_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify({model:S.set.model||GROQ_MODEL,messages,stream:true,temperature:.3,max_tokens:6000})})}
 catch(e){throw{message:"Pas de connexion internet."}}
 if(!res.ok&&!_retry&&(res.status===404||res.status===400)){try{const m=await pickModel(key,S.set.model||GROQ_MODEL);if(m){S.set.model=m;persist();const sel=$("setmodel");if(sel){if(![...sel.options].some(o=>o.value===m))sel.add(new Option(m,m));sel.value=m}return await ask(input,onText,true)}}catch(e){}}
 if(!res.ok){let det="";try{const j=await res.json();det=(j.error&&j.error.message)||""}catch(e){}
  throw{message:res.status===401?"Clé Groq invalide ou expirée (401). Crée-en une nouvelle sur console.groq.com/keys.":res.status===429?"Trop de demandes ou quota atteint (429). Attends un peu.":res.status===403?"Accès refusé (403) : "+(det||"clé bloquée ou région non autorisée."):"Erreur Groq ("+res.status+") : "+(det||"inconnue")+(res.status===400||res.status===404?" → essaie un autre modèle dans les paramètres.":"")}}
 const rd=res.body.getReader(),dec=new TextDecoder();let buf="",text="";
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let n;
  while((n=buf.indexOf("\n"))>=0){const l=buf.slice(0,n).trim();buf=buf.slice(n+1);if(!l.startsWith("data:"))continue;const d=l.slice(5).trim();if(d==="[DONE]")continue;
   try{const t=JSON.parse(d).choices[0].delta.content;if(t){text+=t;if(onText)onText({text})}}catch(e){}}}
 return{text}}

  ${C[3]?`<label>Type</label>${sel("kind",C[3],S.subj["k"+S.tab])}`:""}
  <label>Chapitre / leçon</label><input id="top" placeholder="ex : Théorème de Pythagore, Le roman, La photosynthèse…" value="${esc(S.subj["t"+S.tab]||"")}">
  ${S.tab==="exos"?`<label>Difficulté</label>${sel("lvl",["Facile","Moyen","Difficile","Niveau examen"],"Moyen")}<label>Nombre d'exercices</label>${sel("nb",["4","6","8","10"],"6")}`:""}
  ${S.tab==="quiz"?`<label>Nombre de questions</label>${sel("nb",["5","8","12","15"],"8")}`:""}
  <button class="btn" id="go">${C[2]}</button><div id="err" class="err"></div></div><div class="card out" id="res" style="display:none"></div><div class="chips" id="fu" style="display:none"></div>`}
 a.innerHTML=head+body+`<div class="nav">${TABS.map(t=>`<button class="${t[0]===S.tab?"on":""}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("")}</div>`;
 a.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.last=null;render();window.scrollTo(0,0)});
 $("gear").onclick=()=>{S.tab="settings";render();window.scrollTo(0,0)};
 $("chg").onclick=()=>{S.cls=null;S.chat=[];try{localStorage.removeItem("mk_cls")}catch(e){}render()};
 bind();
 if(S.tab==="home"){a.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.g;S.pre=b.dataset.p||"";render();if(S.pre){$("q").value=S.pre}window.scrollTo(0,0)});
  a.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{S.subj.cur=SUBJ[S.cls][+b.dataset.i];S.tab="prof";render();window.scrollTo(0,0)});
  a.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.serie=b.dataset.s;try{localStorage.setItem("mk_serie",S.serie)}catch(e){}render()})}
 else if(S.tab==="settings")bindSettings();
 else if(S.tab==="prof"){a.querySelectorAll("[data-q]").forEach(c=>c.onclick=()=>{$("q").value=c.dataset.q+" ";$("q").focus()});$("send").onclick=sendChat;
  const c=$("clr");if(c)c.onclick=()=>{S.chat=[];render()};if(S.chat.length)window.scrollTo(0,document.body.scrollHeight)}
 else $("go").onclick=generate}
async function sendChat(){const q=$("q").value.trim();if(!q||S.busy)return;const{sub,d}=getSel();S.busy=true;$("send").disabled=true;$("err").textContent="";
 S.chat.push({role:"user",content:q});S.chat.push({role:"assistant",content:"…"});render();
 let h=S.chat.slice(0,-1).slice(-12).map(m=>({role:m.role,content:m.content}));while(h.length&&h[0].role!=="user")h.shift();
 h[0]={role:"user",content:SYS()+`\nMatière actuelle : ${subjStr(sub,d)}.\n\n`+h[0].content};
 try{const r=await ask(h,({text})=>{S.chat[S.chat.length-1].content=text;const l=document.querySelectorAll("#log .msg");l[l.length-1].innerHTML=md(text)});S.chat[S.chat.length-1].content=r.text;remember(sub+" : "+q.slice(0,60))}
 catch(e){S.chat.pop();S.chat.pop();render();$("err").textContent=e.message||"Une erreur est survenue, réessaie.";S.busy=false;return}
 S.busy=false;render()}
function buildPrompt(sub,d,top,k){const ex=examName(),m=subjStr(sub,d),t=`« ${top} »`;const grid=ex?"":" ";
 if(S.tab==="cours"){return{
  "Résumé de cours":`Rédige un résumé de cours complet et structuré sur ${t} en ${m}, niveau ${ctx()}. Inclure : 1) l'essentiel à retenir, 2) définitions et formules/règles clés (chaque formule sur sa ligne avec le sens de chaque lettre), 3) un exemple chiffré résolu étape par étape avec tous les calculs visibles, 4) trois erreurs fréquentes à éviter, 5) un mini-exercice d'auto-vérification avec réponse.`,
  "Fiche méthode":`Rédige une fiche méthode pratique pour réussir ${t} en ${m} (${ctx()}) : étapes à suivre numérotées, pièges à éviter, modèle rédigé ou exemple traité, et astuces pour le gagner des points en devoir${ex?" et au "+ex:""}.`,
  "Formulaire / lexique à retenir":`Dresse le formulaire / lexique / dates / règles à connaître par cœur sur ${t} en ${m} (${ctx()}), sous forme de liste claire avec une courte explication de chaque élément.`,
  "Erreurs fréquentes & pièges":`Liste les erreurs et pièges les plus fréquents des élèves sur ${t} en ${m} (${ctx()}), avec pour chacun : l'erreur, pourquoi elle est fausse, la bonne méthode et un exemple.`,
  "Explication pour débutant":`Explique ${t} en ${m} comme à un élève qui part de zéro (${ctx()}) : analogies simples tirées de la vie au Sénégal, progression douce, puis 3 questions pour vérifier la compréhension avec réponses.`}[k]}
 if(S.tab==="exos")return`Crée une série de ${$("nb").value} exercices de difficulté « ${$("lvl").value} » sur ${t} en ${m} pour ${ctx()}, progressifs et dans le style des devoirs sénégalais. Donne les énoncés numérotés avec le barème, puis une section « Corrigé détaillé » complète à la fin : pour chaque exercice, applique la structure formule → données → calcul pas à pas (toutes les opérations visibles) → résultat encadré → vérification.`;
 if(S.tab==="quiz")return`Crée un quiz de ${$("nb").value} questions (mélange de QCM à 4 choix et questions courtes) sur ${t} en ${m} pour ${ctx()}. Donne d'abord toutes les questions numérotées, puis une section « Corrigé » avec une explication courte pour chaque réponse (avec le calcul détaillé quand il y en a un).`;
 return{
  [ex?"Sujet complet type "+ex:"Devoir de classe type"]:`Crée un sujet d'entraînement complet ${ex==="BFEM"?"dans le style de l'épreuve du BFEM":ex==="BAC"?"dans le style de l'épreuve du Baccalauréat sénégalais (série "+(S.serie||"")+")":"dans le style d'un devoir de classe sénégalais"} en ${m} sur ${t}, avec en-tête, durée, consignes, barème sur 20, puis un corrigé détaillé avec barème de notation. Précise que c'est un sujet d'entraînement, pas un sujet officiel.`,
  "Devoir de contrôle (1 h)":`Crée un devoir de contrôle d'une heure, noté sur 20, en ${m} sur ${t} pour ${ctx()}, avec corrigé détaillé et barème.`,
  "Plan de révision personnalisé":`Crée un plan de révision sur 4 semaines pour ${ex?"préparer le "+ex:"réviser"} en ${m} (${ctx()}) en partant de ${t}. Présente semaine par semaine : objectifs, chapitres clés du programme à revoir, exercices types, et conseils de méthode. Sois réaliste et motivant.`}[k]}
async function generate(){const{sub,d}=getSel(),top=$("top").value.trim(),k=$("kind")?$("kind").value:"";S.subj["t"+S.tab]=top;if(k)S.subj["k"+S.tab]=k;
 if(!top){$("err").textContent="Indique d'abord le chapitre ou la leçon.";return}
 const P=SYS()+"\n\n"+buildPrompt(sub,d,top,k),r=$("res"),fu=$("fu");r.style.display="block";fu.style.display="none";r.innerHTML="<p class='mu'>⏳ Ton prof prépare ça…</p>";$("go").disabled=true;$("err").textContent="";
 try{const x=await ask(P,({text})=>{r.innerHTML=md(text)});S.last={p:P,t:x.text};remember(sub+" : "+top);showFu()}catch(e){r.style.display="none";$("err").textContent=e.message||"Erreur, réessaie."}
 $("go").disabled=false}
function showFu(){const fu=$("fu");fu.style.display="flex";fu.innerHTML=["🔍 Plus simple","📚 Plus détaillé","🧮 Détaille les calculs","➕ D'autres exemples","❓ Pose-moi des questions"].map(x=>`<button class="chip">${x}</button>`).join("");
 fu.querySelectorAll(".chip").forEach(c=>c.onclick=async()=>{const r=$("res");const old=r.innerHTML;r.innerHTML+="<p class='mu'>⏳…</p>";
  try{const x=await ask([{role:"user",content:S.last.p},{role:"assistant",content:S.last.t},{role:"user",content:c.textContent.replace(/^\S+\s/,"")+" — reprends le contenu précédent en conséquence."}],({text})=>{r.innerHTML=md(text)});S.last.t=x.text}catch(e){r.innerHTML=old}})}
applyPrefs();render();
</script></body></html>
